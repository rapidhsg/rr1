<style>
:root{
  --red:#FF0000;--yellow:#FFFF00;--black:#000;--white:#fff;
  --hairline:#E6E7E8;--body:#333;--page:#F4F2F0;--card:#fff;--muted:#8A8A8A;
  --g:#00C244;--g-ink:#0A7A31;--g-bg:#E4FBEC;--g-glow:rgba(0,194,68,.32);
  --l:#7DDB00;--l-ink:#4A7A0C;--l-bg:#F0FBD6;
  --y:#FFC400;--y-ink:#8A6200;--y-bg:#FFF6D1;
  --r:#FF1A1A;--r-ink:#D10000;--r-bg:#FFE6E6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#111;overflow:hidden;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
body{display:flex;align-items:center;justify-content:center;}
.scaler{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.stage{width:1920px;height:1080px;flex:0 0 auto;background:var(--page);color:var(--body);
  display:grid;grid-template-rows:auto auto 1fr auto;transform-origin:center center;}

/* HEADER */
.head{background:var(--red);border-bottom:4px solid var(--black);
  display:flex;align-items:center;justify-content:space-between;padding:26px 44px;}
.head-left{display:flex;align-items:center;gap:34px;}
.head-logo{height:74px;width:auto;display:block;}
.head-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.02em;font-size:40px;line-height:1;}
.qchip{display:inline-flex;align-items:center;background:var(--yellow);color:var(--black);
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:800;
  font-size:30px;letter-spacing:.02em;padding:8px 20px;}

/* META STRIP under header (Week / Day / Through / Days Left) */
.metastrip{background:var(--black);display:flex;align-items:stretch;}
.metastrip .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:12px 8px;border-right:1px solid #222;}
.metastrip .item:last-child{border-right:none;}
.metastrip .label{color:var(--muted);font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  font-weight:700;font-size:13px;letter-spacing:.16em;}
.metastrip .value{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1;}
.metastrip .value b{color:var(--yellow);}

/* GRID */
.grid{display:grid;grid-template-rows:1.15fr auto 0.85fr;gap:18px;padding:22px 44px;min-height:0;}
.row-headline{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;min-height:0;}
.row-funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;min-height:0;}

/* COMMITTED REVENUE SUBTOTAL BAR (Installed + In Progress vs quarter goal) */
.committed-bar{position:relative;overflow:hidden;background:var(--card);
  border:1px solid var(--hairline);border-left:8px solid var(--muted);
  display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:34px;
  padding:18px 30px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.committed-bar.status-green{border-left-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 20px var(--g-glow);
  animation:breathe 4.5s ease-in-out infinite;}
.committed-bar.status-lime{border-left-color:var(--l);}
.committed-bar.status-yellow{border-left-color:var(--y);}
.committed-bar.status-red{border-left-color:var(--r);}
.cb-label{display:flex;flex-direction:column;gap:4px;}
.cb-label .t{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;
  font-size:22px;letter-spacing:.03em;color:var(--black);background:var(--yellow);padding:5px 11px;align-self:flex-start;}
.cb-label .s{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);}
.cb-total{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:54px;line-height:1;color:var(--black);white-space:nowrap;}
.committed-bar.status-green .cb-total{color:var(--g-ink);}
.cb-track{position:relative;height:22px;background:var(--page);border:1px solid var(--hairline);}
.cb-fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .5s ease;}
.committed-bar.status-green .cb-fill{background:var(--g);}
.committed-bar.status-lime .cb-fill{background:var(--l);}
.committed-bar.status-yellow .cb-fill{background:var(--y);}
.cb-pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--black);}
.cb-pace::after{content:"PACE";position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--black);white-space:nowrap;}
.cb-goal{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap;}
.cb-goal .gnum{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1;color:var(--black);}
.cb-goal .glabel{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;
  font-size:13px;letter-spacing:.1em;color:var(--muted);}
.cb-delta{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.02em;margin-top:2px;}
.cb-delta.ahead{color:var(--g-ink);}
.cb-delta.behind{color:var(--r-ink);}

/* TILE */
.tile{position:relative;overflow:hidden;background:var(--card);
  border:1px solid var(--hairline);
  padding:24px 26px 22px;display:flex;flex-direction:column;min-height:0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.tile>*{position:relative;z-index:1;}

.tile.status-green{}
.tile.status-lime{}
.tile.status-yellow{}
.tile.status-red{}

.tile-header{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px;min-height:34px;}
.tile-label{flex:0 1 auto;min-width:0;align-self:center;white-space:nowrap;display:inline-block;background:#EFF0F1;color:#4A5157;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;
  font-size:20px;letter-spacing:.03em;line-height:1.05;padding:6px 12px;}
.tile-status-badge{flex:0 0 auto;width:auto;align-self:center;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;
  font-size:15px;letter-spacing:.06em;padding:5px 12px;line-height:1;white-space:nowrap;
  color:var(--muted);background:var(--page);border:1px solid var(--hairline);}
.tile.status-green .tile-status-badge{color:#fff;background:var(--g);border-color:var(--g);}
.tile.status-lime .tile-status-badge{color:#fff;background:var(--g);border-color:var(--g);}
.tile.status-yellow .tile-status-badge{color:#fff;background:var(--r);border-color:var(--r);}
.tile.status-red .tile-status-badge{color:#fff;background:var(--r);border-color:var(--r);}

.tile-actual{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--black);
  font-size:88px;line-height:.95;margin-top:8px;}
.tile.status-green .tile-actual, .tile.status-lime .tile-actual{color:var(--g-ink);}
.tile.status-yellow .tile-actual, .tile.status-red .tile-actual{color:var(--r-ink);}
.tile-actual .prefix{color:var(--muted);font-weight:700;}
.row-funnel .tile-actual{font-size:72px;}

.gap-line{font-family:'Barlow Condensed',sans-serif;font-weight:800;
  text-transform:uppercase;font-size:34px;letter-spacing:.02em;line-height:1;}
.gap-line.ahead{color:var(--g-ink);}
.gap-line.behind{color:var(--r-ink);}

.progress-wrap{position:relative;margin-top:auto;margin-bottom:16px;height:20px;background:var(--page);
  border:1px solid var(--hairline);}
.progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--muted);transition:width .5s ease;}
.tile.status-green .progress-fill{background:var(--g);}
.tile.status-red .progress-fill{background:var(--r);}
.tile.status-lime .progress-fill{background:var(--g);}
.tile.status-yellow .progress-fill{background:var(--r);}
.pace-marker{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--black);}
.pace-marker::after{content:"PACE";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;
  color:var(--black);white-space:nowrap;}

.tile-footer{display:flex;align-items:baseline;justify-content:space-between;margin-top:0;gap:14px;}
.tile-footer.solo{justify-content:flex-end;}
.delta{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;
  font-size:20px;letter-spacing:.02em;}
.delta.ahead{color:var(--g-ink);}
.delta.behind{color:var(--r-ink);}
.goal-display{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;
  font-size:19px;letter-spacing:.06em;color:var(--muted);}
.goal-display .goal-num{color:var(--black);font-weight:800;font-size:26px;margin-left:6px;}

/* SLIM FOOTER */
.foot{background:var(--black);position:relative;display:flex;align-items:center;
  justify-content:space-between;padding:12px 44px;}
.foot::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);}
.foot::after{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:var(--yellow);}
.foot-left{display:flex;align-items:center;gap:12px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.04em;}
.foot-left .f-label{color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.1em;}
.foot-left .f-value{color:#fff;font-weight:800;font-size:18px;}
.foot-badge img{height:34px;width:auto;display:block;}
</style>
</head>

<script>
// ============================================================
// RENDER LOGIC
// ============================================================

function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function fmtCurrency(n) {
  if (n >= 1000000) return "$" + (n / 1000000).toFixed(2) + "M";
  if (n >= 1000) return "$" + Math.round(n / 1000) + "K";
  return "$" + Math.round(n).toLocaleString();
}

function fmtCount(n) {
  return Math.round(n).toLocaleString();
}

function fmt(value, type) {
  return type === "currency" ? fmtCurrency(value) : fmtCount(value);
}

function fmtDelta(value, type) {
  const abs = Math.abs(value);
  if (type === "currency") return fmtCurrency(abs);
  return fmtCount(abs);
}

function statusFor(pct, greenThreshold = 100) {
  if (pct >= 100) return "green";              // full win
  if (pct >= greenThreshold) return "lime";    // near pace (98%+ for count-type)
  if (pct >= 90) return "yellow";
  return "red";
}

function statusLabel(s) {
  // Two-state: on pace (green/lime) vs behind (yellow/red)
  return (s === "green" || s === "lime") ? "ON PACE" : "BEHIND";
}

// Returns the last day of the month for a given UTC date string YYYY-MM-DD
function monthEndUTC(dateStr) {
  const d = new Date(dateStr);
  const y = d.getUTCFullYear();
  const m = d.getUTCMonth();
  // Day 0 of next month = last day of current month
  return new Date(Date.UTC(y, m + 1, 0));
}

// Returns {monthLabel, needed} for the monthly checkpoint
function getMonthlyCheckpoint(metric, refreshDate, quarter) {
  const qStart = new Date(quarter.startDate);
  const qEnd = new Date(quarter.endDate);

  // The monthly target is the LATER of: end of current month, or if we're past it, end of next month
  // But capped at quarter end (since beyond quarter end is irrelevant)
  let target = monthEndUTC(refreshDate);
  // If we're on or after month-end, advance one month
  const today = new Date(refreshDate);
  if (today >= target) {
    const next = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 1));
    target = monthEndUTC(next.toISOString().slice(0, 10));
  }
  // Cap at quarter end
  if (target > qEnd) target = qEnd;

  const totalDays = Math.floor((qEnd - qStart) / 86400000) + 1;
  const daysToTarget = Math.floor((target - qStart) / 86400000) + 1;
  const paceAtTarget = metric.goal * (daysToTarget / totalDays);
  const needed = Math.max(0, paceAtTarget - metric.actual);

  const monthLabel = target.toLocaleDateString("en-US", {month: "short", timeZone: "UTC"}).toUpperCase();
  const monthDay = target.getUTCDate();
  const daysRemaining = Math.max(0, Math.ceil((target - today) / 86400000));
  return { monthLabel, monthDay, needed, daysRemaining };
}

function renderQuarterMeta() {
  const { startDate, endDate, refreshDate } = DATA.quarter;
  const totalDays = daysBetween(startDate, endDate) + 1;
  const daysElapsed = daysBetween(startDate, refreshDate) + 1;
  const daysRemaining = totalDays - daysElapsed;
  const pctThrough = (daysElapsed / totalDays) * 100;
  const totalWeeks = Math.round(totalDays / 7); // a quarter = 13 weeks (round, not ceil)
  const weekNum = Math.min(Math.ceil(daysElapsed / 7), totalWeeks);

  document.getElementById("quarter-meta").innerHTML = `
    <div class="item"><span class="label">Week</span><span class="value">${weekNum} / ${totalWeeks}</span></div>
    <div class="item"><span class="label">Day</span><span class="value">${daysElapsed} / ${totalDays}</span></div>
    <div class="item"><span class="label">Through</span><span class="value">${pctThrough.toFixed(1)}%</span></div>
    <div class="item"><span class="label">Days Left</span><span class="value">${daysRemaining}</span></div>
  `;

  document.getElementById("quarter-label").textContent = DATA.quarter.label;
  var _wd=document.getElementById("window-display"); if(_wd) _wd.textContent =
    new Date(startDate).toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"UTC"}) +
    " — " +
    new Date(endDate).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});

  document.getElementById("refresh-display").textContent =
    new Date(refreshDate).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", timeZone:"UTC"});

  return { totalDays, daysElapsed, pctThrough };
}

function renderTile(m, pctThrough) {
  // ============ COVERAGE-TYPE METRIC (Revenue In Progress) ============
  if (m.isCoverage) {
    // Fixed-threshold mode: m.goal is a constant target (e.g., weekly install target)
    // Dynamic-gap mode: m.coverageFrom references another metric, gap = ref.goal - ref.actual
    const target = m.coverageFrom
      ? Math.max(0, DATA.metrics.find(x => x.key === m.coverageFrom).goal - DATA.metrics.find(x => x.key === m.coverageFrom).actual)
      : m.goal;
    const pctOfTarget = target > 0 ? (m.actual / target) * 100 : 100;
    const shortfall = Math.max(0, target - m.actual);
    const surplus = Math.max(0, m.actual - target);
    const status = statusFor(pctOfTarget, m.greenThreshold || 100);
    const fillPct = Math.min(100, pctOfTarget);

    // Status labels
    const coverageLabel = (status === "green" || status === "lime") ? "ON PACE" : "BEHIND";

    // Days remaining in quarter
    const qEnd = new Date(DATA.quarter.endDate);
    const today = new Date(DATA.quarter.refreshDate);
    const qDaysLeft = Math.max(0, Math.ceil((qEnd - today) / 86400000));

    // One clean line: above or below the weekly target
    const covAhead = m.actual >= target;
    const covGap = covAhead
      ? `${fmt(surplus, m.type)} ABOVE`
      : `${fmt(shortfall, m.type)} BELOW`;

    return `
      <div class="tile status-${status}">
        <div class="tile-header">
          <div class="tile-label">${m.label}</div>
          <div class="tile-status-badge">${coverageLabel}</div>
        </div>
        <div class="tile-actual">${fmt(m.actual, m.type)}</div>
        <div class="progress-wrap">
          <div class="progress-fill" style="width: ${fillPct}%"></div>
        </div>
        <div class="tile-footer">
          <div class="gap-line ${covAhead ? 'ahead' : 'behind'}">${covGap}</div>
          <div class="goal-display">
            TARGET <span class="goal-num">${fmt(target, m.type)}</span>
          </div>
        </div>
      </div>
    `;
  }

  // ============ STANDARD PACE-TYPE METRIC ============
  const pace = m.goal * (pctThrough / 100);
  const pctActualVsGoal = (m.actual / m.goal) * 100;
  const pctActualVsPace = pace > 0 ? (m.actual / pace) * 100 : 0;
  const delta = m.actual - pace;
  const isAhead = delta >= 0;
  const status = statusFor(pctActualVsPace, m.greenThreshold || 100);

  // Progress bar fill % is actual/goal (so the pace marker sits where pace/goal % is)
  const fillPct = Math.min(100, pctActualVsGoal);
  const pacePct = Math.min(100, pctThrough);

  // Monthly checkpoint
  const gapLine = isAhead
    ? `${fmt(Math.abs(delta), m.type)} AHEAD`
    : `${fmt(Math.abs(delta), m.type)} BEHIND`;

  return `
    <div class="tile status-${status}">
      <div class="tile-header">
        <div class="tile-label">${m.label}</div>
        <div class="tile-status-badge">${statusLabel(status)}</div>
      </div>
      <div class="tile-actual">${fmt(m.actual, m.type)}</div>
      <div class="progress-wrap">
        <div class="progress-fill" style="width: ${fillPct}%"></div>
        <div class="pace-marker" style="left: ${pacePct}%"></div>
      </div>
      <div class="tile-footer">
        <div class="gap-line ${isAhead ? 'ahead' : 'behind'}">${gapLine}</div>
        <div class="goal-display">
          GOAL <span class="goal-num">${fmt(m.goal, m.type)}</span>
        </div>
      </div>
    </div>
  `;
}

function renderCommitted(pctThrough){
  const installed = DATA.metrics.find(m => m.key === "revenue");
  const inProg    = DATA.metrics.find(m => m.key === "in_progress");
  const goalM     = installed; // Installed goal == quarterly revenue goal
  const total = installed.actual + inProg.actual;
  const goal  = goalM.goal;
  const pctOfGoal = goal > 0 ? (total / goal) * 100 : 100;
  // straight-line pace: where we should be right now
  const paceTarget = goal * (pctThrough / 100);
  const vsPacePct = paceTarget > 0 ? (total / paceTarget) * 100 : 100;
  const status = statusFor(vsPacePct, 98);
  const fillPct = Math.min(100, pctOfGoal);
  const pacePct = Math.min(100, pctThrough);
  const diff = total - paceTarget;
  const ahead = diff >= 0;
  const deltaTxt = (ahead ? "▲ " : "▼ ") + fmtCurrency(Math.abs(diff)) + (ahead ? " ahead of pace" : " behind pace");

  document.getElementById("committed-bar").className = "committed-bar status-" + status;
  document.getElementById("committed-bar").innerHTML = `
    <div class="cb-label">
      <span class="t">Committed Revenue</span>
      <span class="s">Installed + In Progress · what we can count on</span>
    </div>
    <div class="cb-total">${fmtCurrency(total)}</div>
    <div class="cb-track">
      <div class="cb-fill" style="width:${fillPct}%"></div>
      <div class="cb-pace" style="left:${pacePct}%"></div>
    </div>
    <div class="cb-goal">
      <span class="gnum">${fmtCurrency(goal)}</span>
      <span class="glabel">Quarter Goal · ${Math.round(pctOfGoal)}%</span>
      <span class="cb-delta ${ahead ? "ahead" : "behind"}">${deltaTxt}</span>
    </div>`;
}

function render() {
  const { pctThrough } = renderQuarterMeta();

  const headline = DATA.metrics.filter(m => m.tier === "headline");
  const funnel = DATA.metrics.filter(m => m.tier === "funnel");

  document.getElementById("row-headline").innerHTML =
    headline.map(m => renderTile(m, pctThrough)).join("");
  document.getElementById("row-funnel").innerHTML =
    funnel.map(m => renderTile(m, pctThrough)).join("");

  renderCommitted(pctThrough);
}

render(); // render inline fallback first so the screen is never blank
fetch("https://rapidhsg.github.io/dashboard-engine/rr1-data.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function (d) { DATA = d; render(); })
  .catch(function (e) { console.warn("dashboard-engine unreachable, using fallback:", e); });
</script>

    d.style.transform='scale('+Math.min(window.innerWidth/1920,window.innerHeight/1080)+')';}
  window.addEventListener('resize',fit);fit();
})();
